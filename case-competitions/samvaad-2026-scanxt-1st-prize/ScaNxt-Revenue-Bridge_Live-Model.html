    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading ScaNxt Revenue Bridge...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

: 2.5px; text-transform: uppercase; color: #8A5A06;\">Live revenue model · Team KAS<\u002Fp>\n<h1 class=\"disp\" style=\"margin: 0; font-size: 50px; line-height: 1.02; font-weight: 700; color: #1E3A24; letter-spacing: -0.5px;\">The ScaNxt Revenue Bridge<\u002Fh1>\n<p class=\"disp\" style=\"margin: 0; font-size: 24px; font-style: italic; font-weight: 400; color: #2C5F2D;\">Drag any assumption and watch the mix move.<\u002Fp>\n<p style=\"margin: 4px 0 0; font-size: 15px; line-height: 1.55; color: #4E5549;\">₹1.86 cr today → the mix shifts toward recurring intelligence. Move the sliders, click any revenue stream, and pin scenarios to stress-test the plan in real time.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0;\">\n<img class=\"logo\" src=\"9969aa7f-b23d-411e-83a2-6c29b5674b79\" alt=\"ScaNxt, where agriculture meets technology\">\n<\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"wrap-sm\" style=\"display: flex; align-items: center; gap: 12px;\">\n<div style=\"display: flex; gap: 10px; flex-grow: 1;\">\n<sc-for list=\"{{ tabs }}\" as=\"item\" hint-placeholder-count=\"3\">\n<button type=\"button\" class=\"tab {{ item.cls }}\" aria-pressed=\"{{ item.pressed }}\" sc-camel-on-click=\"{{ item.pick }}\"><span class=\"t1\">{{ item.tab }}<\u002Fspan><span class=\"t2\">{{ item.sub }}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"seg2\" role=\"group\" aria-label=\"Units\">\n<button type=\"button\" class=\"{{ crCls }}\" sc-camel-on-click=\"{{ setCr }}\">₹ cr<\u002Fbutton>\n<button type=\"button\" class=\"{{ lakhCls }}\" sc-camel-on-click=\"{{ setLakh }}\">₹ lakh<\u002Fbutton>\n<\u002Fdiv>\n<button type=\"button\" class=\"ghost\" sc-camel-on-click=\"{{ reset }}\">Reset<\u002Fbutton>\n<\u002Fdiv>\n\n<div class=\"stack-sm\" style=\"display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); gap: 22px; align-items: start;\">\n\n<section class=\"panel\" style=\"padding: 24px ory &amp; marketplace. Base case ₹1,000, vs ₹4,000+ value created.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 14px 0; border-bottom: 1px solid #E3E1D6;\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline;\"><label for=\"adv\" style=\"font-size: 15px; font-weight: 700; color: #1E3A24;\">Advisory subscription / season<\u002Flabel><span class=\"disp num\" style=\"font-size: 22px; font-weight: 700; color: #8A5A06;\">{{ vAdv }}<\u002Fspan><\u002Fdiv>\n<input id=\"adv\" type=\"range\" min=\"200\" max=\"800\" step=\"50\" value=\"{{ adv }}\" sc-camel-on-change=\"{{ onAdv }}\" style=\"background: {{ tAdv }};\">\n<div style=\"font-size: 12px; line-height: 1.5; color: #6B7169;\">The recurring engine. A fraction of the fertiliser waste it removes.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 14px 0; border-bottom: 1px solid #E3E1D6;\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline;\"><label for=\"take\" style=\"font-size: 15px; font-weight: 700; color: #1E3A24;\">Marketplace take-rate<\u002Flabel><span class=\"disp num\" style=\"font-size: 22px; font-weight: 700; color: #8A5A06;\">{{ vTake }}<\u002Fspan><\u002Fdiv>\n<input id=\"take\" type=\"range\" min=\"3\" max=\"12\" step=\"1\" value=\"{{ take }}\" sc-camel-on-change=\"{{ onTake }}\" style=\"background: {{ tTake }};\">\n<div style=\"font-size: 12px; line-height: 1.5; color: #6B7169;\">Thin, neutral fee on partner-supplied inputs. Never a mark-up on the bag.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 14px 0 12px;\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline;\"><label for=\"dev\" style=\"font-size: 15px; font-weight: 700; color: #1E3A24;\">Device &amp; one-time share of mix<\u002Flabel><span class=\"disp num\" style=\"font-size: 22px; font-weight: 700; color: #8A5A06;\">{{ vDev }}<\u002Fspan><\u002Fdiv>\n<input id=\"dev\" type=\"range\" min=\"5\" max=\"70\" step=\"1\" value=\"{{ dev }}\" sc-camel-on-c  youLeft }};\">You: {{ total }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;\">\n<div style=\"background: rgba(30,58,36,.06); border-radius: 12px; padding: 12px 14px;\">\n<div style=\"font-size: 12px; font-weight: 700; color: #6B7169;\">₹7 cr milestone<\u002Fdiv>\n<div class=\"disp num\" style=\"font-size: 20px; font-weight: 700; color: #1E3A24;\">{{ gap7 }}<\u002Fdiv>\n<div class=\"num\" style=\"font-size: 12px; color: #6B7169;\">{{ need7 }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: rgba(30,58,36,.06); border-radius: 12px; padding: 12px 14px;\">\n<div style=\"font-size: 12px; font-weight: 700; color: #6B7169;\">₹25 cr vision<\u002Fdiv>\n<div class=\"disp num\" style=\"font-size: 20px; font-weight: 700; color: #1E3A24;\">{{ gap25 }}<\u002Fdiv>\n<div class=\"num\" style=\"font-size: 12px; color: #6B7169;\">{{ need25 }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"panel\" style=\"padding: 22px 24px;\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;\">\n<h2 style=\"margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #2C5F2D;\">Revenue mix<\u002Fh2>\n<span class=\"num\" style=\"font-size: 13px; font-weight: 700; color: #1E3A24;\">{{ recPctTxt }} recurring<\u002Fspan>\n<\u002Fdiv>\n<div class=\"bar\">\n<sc-for list=\"{{ streams }}\" as=\"item\" hint-placeholder-count=\"4\">\n<button type=\"button\" class=\"segb {{ item.cls }} {{ item.selCls }}\" style=\"width: {{ item.w }};\" aria-label=\"{{ item.name }}, {{ item.pctTxt }}\" title=\"{{ item.name }}: {{ item.pctTxt }}\" sc-camel-on-click=\"{{ item.pick }}\"><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 12px;\">\n<sc-for list=\"{{ streams }}\" as=\"item\" hint-placeholder-count=\"4\">\n<button type=\"button\" class=\"leg {{ item.selCls }}\" ari \" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start;\">\n\n<section class=\"panel\" style=\"padding: 22px 24px;\">\n<h2 style=\"margin: 0 0 4px; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #2C5F2D;\">Farmer value check<\u002Fh2>\n<p style=\"margin: 0 0 14px; font-size: 13px; color: #6B7169; line-height: 1.5;\">Is the price fair for the farmer? Compare what ScaNxt charges with the value it creates on the field.<\u002Fp>\n<div style=\"display: flex; justify-content: space-between; align-items: baseline;\"><label for=\"value\" style=\"font-size: 15px; font-weight: 700; color: #1E3A24;\">Value created per farmer / year<\u002Flabel><span class=\"disp num\" style=\"font-size: 22px; font-weight: 700; color: #8A5A06;\">{{ vValue }}<\u002Fspan><\u002Fdiv>\n<input id=\"value\" type=\"range\" min=\"1500\" max=\"10000\" step=\"250\" value=\"{{ value }}\" sc-camel-on-change=\"{{ onValue }}\" style=\"background: {{ tValue }};\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 0 12px;\">\n<div style=\"background: #FFFFFF; border: 1px solid #E3E1D6; border-radius: 12px; padding: 12px 14px;\">\n<div style=\"font-size: 12px; font-weight: 700; color: #6B7169;\">Every ₹1 paid returns<\u002Fdiv>\n<div class=\"disp num\" style=\"font-size: 28px; font-weight: 700; color: #1E3A24;\">{{ ratioTxt }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #E3E1D6; border-radius: 12px; padding: 12px 14px;\">\n<div style=\"font-size: 12px; font-weight: 700; color: #6B7169;\">Farmer keeps<\u002Fdiv>\n<div class=\"disp num\" style=\"font-size: 28px; font-weight: 700; color: #1E3A24;\">{{ keepTxt }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; font-size: 12px; color: #6B7169; margin-bottom: 6px;\"><span>ScaNxt captures {{ captureTxt }}<\u002Fspan><span>Farmer keeps {{ keepTxt }}<\u002Fspan><\u002Fdiv>\n<div class=\"track\" style=\"background: #97BC62;\">\n<div class=\"fill\" style=\"width: {{ captureW }}; background: #E8A317;\"><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"{{ valueCls }}\" style=\"margin: 12px 0 0; font-size: 14px; font-weight: 700;\">{{ valueVerdict }}<\u002Fp>\n<\u002Fsection>\n\n<section class=\"panel\" style=\"padding: 22px 24px;\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;\">\n<h2 style=\"margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #2C5F2D;\">Scenario compare<\u002Fh2>\n<sc-if value=\"{{ hasPins }}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" class=\"ghost\" sc-camel-on-click=\"{{ clearPins }}\">Clear all<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<p style=\"margin: 0 0 12px; font-size: 13px; color: #6B7169; line-height: 1.5;\">Pin up to three settings with the blue button, then compare them side by side.<\u002Fp>\n<sc-if value=\"{{ noPins }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border: 1.5px dashed #C9C5B2; border-radius: 14px; padding: 34px 18px; text-align: center; font-size: 14px; color: #6B7169;\">No scenarios pinned yet. Set the sliders, then press <b style=\"color: #1B75BC;\">Pin this scenario<\u002Fb>.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ hasPins }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: grid; grid-template-columns: 1.3fr 1fr 0.8fr 1fr 0.8fr 44px; gap: 8px; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #6B7169; padding: 0 4px 8px; border-bottom: 1px solid #E3E1D6;\">\n<span>Scenario<\u002Fspan><span>Farmers<\u002Fspan><span>ARPU<\u002Fspan><span>Revenue<\u002Fspan><span>Recurring<\u002Fspan><span><\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ pinRows }}\" as=\"item\" hint-placeholder-count=\"2\">\n<div class=\"num\" style=\"display: grid; grid-template-columns: 1.3fr 1fr 0.8fr 1fr 0.8fr 44px; gap: 8px; align-items: center; font-size: 14px; padding: 4px; border-bottom: 1px solid #E3E1D6;\">\n<span style=\"font-weight: 700; color: #1E3A24;\">{{ item.idx }}<br><span style=\"font-size: 12px; font-weight: 500; color: #6B7169;\">{{ item.name }}<\u002Fspan><\u002Fspan>\n<span>{{ item.farmersTxt }}<\u002Fspan>\n<span>{{ item.arpuTxt }}<\u002Fspan>\n<span class=\"disp\" style=\"font-weight: 700; color: #1E3A24;\">{{ item.totalTxt }}<\u002Fspan>\n<span>{{ item.recTxt }}<\u002Fspan>\n<button type=\"button\" class=\"pin-x\" aria-label=\"Remove {{ item.idx }}\" sc-camel-on-click=\"{{ item.remove }}\">×<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fdiv>\n\n<p style=\"margin: 6px 0 0; font-size: 12px; line-height: 1.6; color: #6B7169; font-style: italic; text-align: center;\">Illustrative driver-based model built by Team KAS. Every figure is a stated assumption benchmarked to government (₹190/sample) and competitor data, not audited actuals or figures provided by ScaNxt.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;bgOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.1,&quot;min&quot;:0,&quot;max&quot;:0.4,&quot;step&quot;:0.01,&quot;section&quot;:&quot;Background&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1840}}\">\nclass Component extends DCLogic {\n  presets() {\n    return [\n      { farmers: 26500, arpu: 700, adv: 300, take: 5, dev: 70, tab: 'Today', sub: '~₹1.86 cr', label: 'Starting point: device and testing heavy.' },\n      { farmers: 70000, arpu: 1000, adv: 400, take: 6, dev: 35, tab: 'Year 1', sub: '₹7 cr milestone', label: '₹7 cr milestone ≈ 70,000 monetised farmers.' },\n      { farmers: 250000, arpu: 1000, adv: 450, take: 7, dev: 12, tab: 'Year 3', sub: '₹25 cr vision', label: '₹25 cr vision ≈ 250,000 monetised farmers.' }\n    ];\n  }\n  pick(p) {\n    return { farmers: p.farmers, arpu: p.arpu, adv: p.adv, take: p.take, dev: p.dev };\n  }\n  st() {\n    const base = Object.assign({ stage: 0, edited: false, unit: 'cr', focus: 'adv', value: 4000, pins: [] }, this.pick(this.presets()[0]));\n    return Object.assign(base, this.state || {});\n  }\n  renderVals() {\n    const s = this.st();\n    const P = this.presets();\n    const unit = s.unit;\n    const fmt = (n) => {\n      if (unit === 'lakh') {\n        const l = n * 100;\n        return '₹' + l.toLocaleString('en-IN', { maximumFractionDigits: l < 100 ? 1 : 0 }) + ' L';\n      }\n      return '₹' + n.toFixed(n < 10 ? 2 : 1) + ' cr';\n    };\n    const fmtN = (n) => Math.round(n).toLocaleString('en-IN');\n    const farmers = +s.farmers, arpu = +s.arpu, adv = +s.adv, take = +s.take, dev = +s.dev, value = +s.value;\n\n    const totalCr = farmers * arpu / 1e7;\n    const rem = 100 - dev;\n    const den = adv + take * 60 + 300;\n    const advPct = rem * adv / den;\n    const mktPct = rem * take * 60 / den;\n    const testPct = rem - advPct - mktPct;\n    const recPct = advPct + mktPct;\n\n    const track = (v, min, max) => {\n      const p = ((v - min) / (max - min) * 100).toFixed(2);\n      return 'linear-gradient(90deg, #2C5F2D 0%, #5B8C3E ' + p + '%, #DAD6C4 ' + p + '%, #DAD6C4 100%)';\n    };\n    const set = (k) => (e) => this.setState({ [k]: +e.target.value, edited: k !== 'value' ? true : !!s.edited });\n\n    const tabs = P.map((p, i) => ({\n      tab: p.tab, sub: p.sub,\n      cls: s.stage === i ? 'on' : '',\n      pressed: s.stage === i ? 'true' : 'false',\n      pick: () => this.setState(Object.assign(this.pick(p), { stage: i, edited: false }))\n    }));\n\n    const raw = [\n      { key: 'dev', name: 'Device & one-time', row: 'Device & one-time', cls: 'c-dev', pct: dev,\n        desc: 'The soil-testing device, sold near cost as a trojan horse. It opens the relationship with the farmer; its share of the mix should shrink as recurring revenue grows.' },\n      { key: 'test', name: 'Testing & govt', row: 'Testing & govt contracts', cls: 'c-test', pct: testPct,\n        desc: 'Per-sample testing and government soil-health contracts, benchmarked to the government rate of ₹190 per sample. In this model it is the balancing stream.' },\n      { key: 'adv', name: 'Advisory', row: 'Advisory subscriptions', cls: 'c-adv', pct: advPct,\n        desc: 'Seasonal advisory subscription, the recurring engine. Priced at a fraction of the fertiliser waste it removes, so its weight rises with the subscription price.' },\n      { key: 'mkt', name: 'Marketplace & data', row: 'Marketplace & data', cls: 'c-mkt', pct: mktPct,\n        desc: 'A thin, neutral take-rate on partner-supplied inputs, never a mark-up on the bag, plus data services. Its weight rises with the take-rate.' }\n    ];\n    const streams = raw.map((x) => ({\n      key: x.key, name: x.name, row: x.row, cls: x.cls, desc: x.desc,\n      w: Math.max(x.pct, 0).toFixed(2) + '%',\n      pctTxt: x.pct.toFixed(1) + '%',\n      amt: fmt(totalCr * x.pct / 100),\n      selCls: s.focus === x.key ? 'sel' : '',\n      pressed: s.focus === x.key ? 'true' : 'false',\n      pick: () => this.setState({ focus: x.key })\n    }));\n    const focus = streams.find((x) => x.key === s.focus) || streams[2];\n\n    let totalNote = '';\n    if (totalCr < 3) totalNote = 'Early stage: building the corpus and the cash together.';\n    else if (totalCr < 12) totalNote = 'Around the ₹7 cr milestone: recurring revenue taking hold.';\n    else if (totalCr < 30) totalNote = 'Around the ₹25 cr vision: advisory & marketplace lead the mix.';\n    else totalNote = 'Beyond the stated targets. Check that the farmer base is realistic.';\n\n    let recVerdict = '', recCls = '';\n    if (recPct >= 50) { recVerdict = 'Recurring now leads. This is the defensible mix.'; recCls = 'v-good'; }\n    else if (recPct >= 30) { recVerdict = 'The shift is underway.'; recCls = 'v-mid'; }\n    else { recVerdict = 'Still hardware dependent. Keep shifting.'; recCls = 'v-low'; }\n\n    const pos = (v) => Math.min(Math.sqrt(Math.max(v, 0) / 30), 1) * 100;\n    const marks = [\n      { v: 1.86, label: 'Today' }, { v: 7, label: 'Year 1' }, { v: 25, label: 'Year 3' }\n    ].map((m) => ({ label: m.label, sub: fmt(m.v), left: pos(m.v).toFixed(2) + '%', cls: totalCr >= m.v - 0.005 ? 'hit' : '' }));\n\n    const gapTxt = (t) => totalCr >= t ? 'Cleared' : fmt(t - totalCr) + ' to go';\n    const needTxt = (t) => 'Needs ' + fmtN(t * 1e7 / arpu) + ' farmers at ₹' + fmtN(arpu) + ' ARPU';\n\n    const ratio = value / arpu;\n    const capture = Math.min(arpu / value * 100, 100);\n    let valueVerdict = '', valueCls = '';\n    if (ratio >= 4) { valueVerdict = 'Strong. The farmer gets four times or more back, which makes the sale easy.'; valueCls = 'v-good'; }\n    else if (ratio >= 2.5) { valueVerdict = 'Healthy, but expect some price pushback in a weak season.'; valueCls = 'v-mid'; }\n    else { valueVerdict = 'Thin. The farmer keeps too little of the value; expect resistance.'; valueCls = 'v-low'; }\n\n    const pins = s.pins || [];\n    const pinRows = pins.map((p, i) => ({\n      idx: 'Scenario ' + String.fromCharCode(65 + i),\n      name: p.name,\n      farmersTxt: fmtN(p.farmers),\n      arpuTxt: '₹' + fmtN(p.arpu),\n      totalTxt: fmt(p.totalCr),\n      recTxt: Math.round(p.rec) + '%',\n      remove: () => this.setState({ pins: (this.st().pins || []).filter((x) => x.id !== p.id) })\n    }));\n\n    return {\n      bgOpacity: this.props.bgOpacity ?? 0.1,\n      tabs,\n      crCls: unit === 'cr' ? 'on' : '',\n      lakhCls: unit === 'lakh' ? 'on' : '',\n      setCr: () => this.setState({ unit: 'cr' }),\n      setLakh: () => this.setState({ unit: 'lakh' }),\n      reset: () => this.setState(Object.assign(this.pick(P[s.stage]), { edited: false })),\n      edited: !!s.edited,\n\n      farmers, arpu, adv, take, dev, value,\n      vFarmers: fmtN(farmers), vArpu: '₹' + fmtN(arpu), vAdv: '₹' + fmtN(adv), vTake: take + '%', vDev: dev + '%', vValue: '₹' + fmtN(value),\n      tFarmers: track(farmers, 5000, 400000), tArpu: track(arpu, 400, 1600), tAdv: track(adv, 200, 800),\n      tTake: track(take, 3, 12), tDev: track(dev, 5, 70), tValue: track(value, 1500, 10000),\n      onFarmers: set('farmers'), onArpu: set('arpu'), onAdv: set('adv'), onTake: set('take'), onDev: set('dev'), onValue: set('value'),\n\n      total: fmt(totalCr),\n      formula: fmtN(farmers) + ' farmers × ₹' + fmtN(arpu) + ' a year',\n      totalNote,\n      stageLabel: s.edited ? 'Custom scenario built from the ' + P[s.stage].tab + ' preset. Press Reset to go back.' : P[s.stage].label,\n      pinLabel: pins.length >= 3 ? 'Pin (replaces oldest)' : 'Pin this scenario',\n      pin: () => {\n        const cur = this.st().pins || [];\n        const next = cur.concat([{ id: Date.now() + Math.random(), name: s.edited ? 'Custom, from ' + P[s.stage].tab : P[s.stage].tab + ' preset', farmers, arpu, totalCr, rec: recPct }]).slice(-3);\n        this.setState({ pins: next });\n      },\n\n      marks,\n      youLeft: pos(totalCr).toFixed(2) + '%',\n      gap7: gapTxt(7), need7: needTxt(7),\n      gap25: gapTxt(25), need25: needTxt(25),\n\n      streams, focus,\n      recPctTxt: Math.round(recPct) + '%',\n      recAbs: fmt(totalCr * recPct / 100) + ' (' + Math.round(recPct) + '%)',\n      recVerdict, recCls,\n\n      ratioTxt: '₹' + ratio.toFixed(1),\n      keepTxt: Math.round(100 - capture) + '%',\n      captureTxt: Math.round(capture) + '%',\n      captureW: capture.toFixed(2) + '%',\n      valueVerdict, valueCls,\n\n      pinRows,\n      hasPins: pins.length > 0,\n      noPins: pins.length === 0,\n      clearPins: () => this.setState({ pins: [] })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
