  <g fill="#CBB176" stroke="#A98F55" stroke-width="3">
    <rect x="1030" y="680" width="90" height="20" rx="8"/>
    <line x1="1046" y1="700" x2="1040" y2="780"/><line x1="1104" y1="700" x2="1110" y2="780"/>
    <rect x="1160" y="680" width="90" height="20" rx="8"/>
    <line x1="1176" y1="700" x2="1170" y2="780"/><line x1="1234" y1="700" x2="1240" y2="780"/>
  </g>

  <!-- Caption strip -->
  <rect y="840" width="1400" height="60" fill="#1E4D3B"/>
  <text x="700" y="878" text-anchor="middle" font-size="19" letter-spacing="4" fill="#FBF5F3"
