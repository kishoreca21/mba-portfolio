    </g>
  </g>

  <!-- Counter props: brass urn, kulhad stack, blue tea, cookie jar -->
  <g>
    <!-- urn -->
    <path d="M486 400 C470 424 470 448 486 466 L546 466 C562 448 562 424 546 400 Z" fill="#C9A063"/>
    <rect x="498" y="384" width="36" height="18" rx="6" fill="#C9A063"/>
    <rect x="480" y="462" width="72" height="10" rx="4" fill="#A98F55"/>
