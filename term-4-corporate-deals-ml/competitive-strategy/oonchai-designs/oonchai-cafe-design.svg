  <text x="570" y="618" text-anchor="middle" font-size="17" fill="#1E4D3B" font-weight="bold">BRING YOUR FLASK</text>
  <text x="570" y="656" text-anchor="middle" font-size="34" fill="#3E7C59" font-weight="bold">−10%</text>
  <text x="570" y="684" text-anchor="middle" font-size="13" fill="#B98A93">zero plastic · always</text>

  <rect x="730" y="580" width="200" height="118" rx="10" fill="#FBF5F3" stroke="#F3B8C6" stroke-width="4"/>
  <text x="830" y="618" text-anchor="middle" font-size="16" fill="#1E4D3B" font-weight="bold">SEED-PAPER CARD</text>
  <text x="830" y="648" text-anchor="middle" font-size="14" fill="#3E7C59">10 stamps = tree in your name</text>
  <text x="830" y="676" text-anchor="middle" font-size="14" fill="#3E7C59">then plant the card itself</text>

  <!-- ===== Potted bamboo (left) and stools (right) ===== -->
  <g>
