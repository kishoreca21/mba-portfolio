      <line x1="560" y1="496" x2="560" y2="760"/><line x1="600" y1="496" x2="600" y2="760"/>
      <line x1="640" y1="496" x2="640" y2="760"/><line x1="680" y1="496" x2="680" y2="760"/>
      <line x1="720" y1="496" x2="720" y2="760"/><line x1="760" y1="496" x2="760" y2="760"/>
      <line x1="800" y1="496" x2="800" y2="760"/><line x1="840" y1="496" x2="840" y2="760"/>
      <line x1="880" y1="496" x2="880" y2="760"/><line x1="920" y1="496" x2="920" y2="760"/>
    </g>
    <g stroke="#A98F55" stroke-width="3">
