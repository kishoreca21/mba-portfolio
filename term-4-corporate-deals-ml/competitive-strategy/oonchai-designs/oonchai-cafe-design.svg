  <text x="225" y="292" text-anchor="middle" font-size="30" fill="#FBF5F3" font-family="Georgia, serif" font-style="italic">Menu</text>
  <line x1="110" y1="306" x2="340" y2="306" stroke="#F3B8C6" stroke-width="2"/>
  <g font-size="17" fill="#FBF5F3">
