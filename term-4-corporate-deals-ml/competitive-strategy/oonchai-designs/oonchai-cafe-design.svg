    <text x="90" y="374">Rose Blush Tea</text>
    <text x="90" y="406">Chamomile Calm</text>
    <text x="90" y="438">Matcha Whisk</text>
    <text x="90" y="470">Kashmiri Pink Noon Chai ✦</text>
    <text x="90" y="502">World Tea Trail · Iced Teas</text>
  </g>
  <line x1="90" y1="520" x2="360" y2="520" stroke="#A8CBB2" stroke-width="2"/>
  <g font-size="15" fill="#F3B8C6" font-weight="bold">
