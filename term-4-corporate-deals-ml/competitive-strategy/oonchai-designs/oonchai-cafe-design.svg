    <circle cx="250" cy="70" r="50" fill="#F3B8C6"/><circle cx="350" cy="70" r="50" fill="#FBF5F3"/>
    <circle cx="450" cy="70" r="50" fill="#F3B8C6"/><circle cx="550" cy="70" r="50" fill="#FBF5F3"/>
    <circle cx="650" cy="70" r="50" fill="#F3B8C6"/><circle cx="750" cy="70" r="50" fill="#FBF5F3"/>
    <circle cx="850" cy="70" r="50" fill="#F3B8C6"/><circle cx="950" cy="70" r="50" fill="#FBF5F3"/>
