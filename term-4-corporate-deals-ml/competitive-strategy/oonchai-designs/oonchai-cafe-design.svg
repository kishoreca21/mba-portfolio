    <text x="90" y="574">Trail Flight ₹249</text>
  </g>
  <text x="225" y="596" text-anchor="middle" font-size="13" fill="#A8CBB2">free millet cookie with M &amp; L</text>

  <!-- ===== IMPACT BOARD blackboard (right) — the hero wall ===== -->
  <rect x="1010" y="240" width="330" height="360" rx="10" fill="#2A2724" stroke="#C9A063" stroke-width="8"/>
  <text x="1175" y="292" text-anchor="middle" font-size="26" letter-spacing="3" fill="#FBF5F3" font-family="Georgia, serif">IMPACT BOARD</text>
  <line x1="1060" y1="306" x2="1290" y2="306" stroke="#F3B8C6" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="1175" y="352" font-size="34" fill="#A8CBB2" font-weight="bold">128 kg</text>
    <text x="1175" y="376" font-size="14" fill="#FBF5F3">tea waste turned into fuel briquettes</text>
    <text x="1175" y="428" font-size="34" fill="#F3B8C6" font-weight="bold">214</text>
    <text x="1175" y="452" font-size="14" fill="#FBF5F3">trees planted in your names</text>
    <text x="1175" y="504" font-size="34" fill="#A8CBB2" font-weight="bold">1,032</text>
    <text x="1175" y="528" font-size="14" fill="#FBF5F3">kulhads returned to the earth</text>
    <text x="1175" y="576" font-size="15" fill="#F3B8C6" font-style="italic" font-family="Georgia, serif">your 10th cup grows a tree</text>
  </g>

