    <!-- matcha bowl -->
    <path d="M780 434 C780 458 800 470 820 470 C840 470 860 458 860 434 Z" fill="#3E7C59"/>
    <ellipse cx="820" cy="434" rx="40" ry="9" fill="#A8CBB2"/>
    <!-- cookie jar -->
    <rect x="894" y="410" width="56" height="60" rx="10" fill="none" stroke="#B98A93" stroke-width="4"/>
    <circle cx="912" cy="446" r="9" fill="#C9A063"/><circle cx="934" cy="452" r="9" fill="#C9A063"/>
    <circle cx="924" cy="430" r="9" fill="#C9A063"/>
    <rect x="890" y="402" width="64" height="10" rx="5" fill="#B98A93"/>
