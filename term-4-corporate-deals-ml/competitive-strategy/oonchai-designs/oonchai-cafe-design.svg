    <!-- blue pea iced tea glass -->
    <path d="M700 408 L736 408 L730 470 L706 470 Z" fill="#7A9CD4"/>
    <path d="M702 430 L734 430 L730 470 L706 470 Z" fill="#9B7AC9"/>
    <line x1="726" y1="398" x2="712" y2="446" stroke="#CBB176" stroke-width="4" stroke-linecap="round"/>
